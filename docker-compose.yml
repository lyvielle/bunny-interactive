services:
  bunny-web:
    build: .
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${HOST_PORT:-8000}:8000"
    environment:
      BUNNY_API: ${BUNNY_API:-https://cutebunny.io}
      HWID_SALT: ${HWID_SALT:?set HWID_SALT}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      REMEMBER_KEY: ${REMEMBER_KEY:-}  # optional Fernet key; empty = generated in the data volume
      DATA_DIR: ${DATA_DIR:-/data}
      STRICT_NAMES: ${STRICT_NAMES:-1}
      VERIFY_TLS: ${VERIFY_TLS:-1}
      DOWNLOAD_ENABLED: ${DOWNLOAD_ENABLED:-0}  # dev feature: 1 shows the "Download to server" switch
      DOWNLOAD_PATH: ${DOWNLOAD_PATH:-/download}
    volumes:
      - bunny-data:${DATA_DIR:-/data}
      # DOWNLOAD_HOST_DIR: a named volume (default) or an absolute host path for a bind mount
      - ${DOWNLOAD_HOST_DIR:-bunny-download}:${DOWNLOAD_PATH:-/download}
    restart: unless-stopped

volumes:
  bunny-data:
  bunny-download:
